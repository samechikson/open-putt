name: Deploy frontend to Firebase Hosting

# Auto-deploys the frontend to Firebase Hosting (project/site "putting-gate")
# on every push to main that touches the frontend, the hosting config, or this
# workflow. The actual build is firebase.json's `predeploy` hook
# (`npm --prefix frontend run build`); `npm ci` below installs the deps it needs.
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "firebase.json"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch: {}

# Never run two live deploys at once; a newer push supersedes an in-flight one.
concurrency:
  group: firebase-hosting-live
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      # Vite bakes VITE_* into the bundle at build time. The build runs inside
      # this step via firebase.json's predeploy hook, which inherits this env.
      # The Firebase web config is public (safe in the browser; the backend
      # verifies ID tokens) — stored as repo variables, not secrets.
      - name: Deploy to Firebase Hosting (live)
        uses: FirebaseExtended/action-hosting-deploy@v0
        env:
          VITE_API_BASE: /api
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: putting-gate
          channelId: live
